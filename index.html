<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulk Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <h1>Bulk Tracker</h1>

    <nav class="page-nav">
      <button class="nav-btn active" data-page="dashboard">Dashboard</button>
      <button class="nav-btn" data-page="gym">Gym</button>
    </nav>

    <button id="settings-btn" class="settings-btn" aria-label="Open settings">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>Settings</span>
    </button>
  </header>

  <!-- Settings popup -->
  <div id="settings-overlay" class="overlay hidden"></div>
  <div id="settings-modal" class="settings-modal hidden" role="dialog" aria-label="Settings">
    <div class="settings-modal-header">
      <h2>Settings</h2>
      <button id="settings-close" class="icon-btn" aria-label="Close settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="settings-section">
      <h3>Theme</h3>
      <div class="theme-options">
        <button class="theme-swatch" data-theme="midnight">
          <span class="swatch-preview swatch-midnight"></span>
          Midnight Navy
        </button>
        <button class="theme-swatch" data-theme="charcoal">
          <span class="swatch-preview swatch-charcoal"></span>
          Charcoal
        </button>
        <button class="theme-swatch" data-theme="graphite">
          <span class="swatch-preview swatch-graphite"></span>
          Graphite
        </button>
      </div>
    </div>
  </div>

  <main>

    <!-- Dashboard page -->
    <section id="page-dashboard" class="page">
      <div class="card">
        <h2>Dashboard</h2>
        <p class="placeholder">Your weekly overview will live here — gym sessions, work hours, and earnings at a glance.</p>
      </div>
    </section>

    <!-- Gym page -->
    <section id="page-gym" class="page hidden">
      <div class="card">
        <h2>Log a session</h2>

        <div class="field">
          <label for="session-type">Which session did you do?</label>
          <select id="session-type">
            <option value="">Select session...</option>
            <option value="Upper A">Upper A</option>
            <option value="Lower A">Lower A</option>
            <option value="Upper B">Upper B</option>
            <option value="Lower B">Lower B</option>
          </select>
        </div>

        <div class="field">
          <label for="session-date">Date</label>
          <input type="date" id="session-date" />
        </div>

        <button id="log-session-btn">Log session</button>
      </div>

      <div class="card">
        <div class="history-header">
          <h2>History</h2>
          <div class="view-toggle">
            <button id="view-list-btn" class="toggle-btn active">List</button>
            <button id="view-calendar-btn" class="toggle-btn">Calendar</button>
          </div>
        </div>

        <div id="history-list" class="history-list"></div>

        <div id="history-calendar" class="history-calendar hidden">
          <div class="cal-nav">
            <button id="cal-prev">&lt;</button>
            <span id="cal-month-label"></span>
            <button id="cal-next">&gt;</button>
          </div>
          <div id="cal-grid" class="cal-grid"></div>
        </div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
