<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulk Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <button class="brand" id="home-btn">
      <span class="brand-mark"></span>
      <span class="brand-name">Bulk Tracker</span>
    </button>

    <nav class="page-nav">
      <button class="nav-btn" data-page="gym">Gym</button>
      <button class="nav-btn" data-page="work">Work</button>
    </nav>

    <button id="settings-btn" class="icon-btn" aria-label="Open settings">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <!-- Settings popup -->
  <div id="settings-overlay" class="overlay hidden"></div>
  <div id="settings-modal" class="settings-modal hidden" role="dialog" aria-label="Settings">
    <div class="settings-modal-header">
      <h2>Settings</h2>
      <button id="settings-close" class="icon-btn" aria-label="Close settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="settings-section">
      <h3>Theme</h3>
      <div class="theme-options">
        <button class="theme-swatch" data-theme="midnight">
          <span class="swatch-preview swatch-midnight"></span>
          Navy
        </button>
        <button class="theme-swatch" data-theme="violet">
          <span class="swatch-preview swatch-violet"></span>
          Violet
        </button>
        <button class="theme-swatch" data-theme="sage">
          <span class="swatch-preview swatch-sage"></span>
          Sage
        </button>
      </div>
    </div>

    <div class="settings-section">
      <h3>Work</h3>
      <div class="settings-field-card">
        <label for="wage-input">Hourly wage</label>
        <div class="wage-input-row">
          <input type="number" id="wage-input" min="0" step="0.5" placeholder="e.g. 180" />
          <span class="wage-unit">kr/h</span>
        </div>
      </div>
    </div>
  </div>

  <main>

    <!-- Dashboard page (home) -->
    <section id="page-dashboard" class="page">

      <div class="readout-strip">
        <div class="readout">
          <div class="readout-label">Sessions / wk</div>
          <div class="readout-value" id="ro-sessions">0<span class="readout-unit">/4</span></div>
        </div>
        <div class="readout-divider"></div>
        <div class="readout">
          <div class="readout-label">Hours / wk</div>
          <div class="readout-value" id="ro-hours">0.0<span class="readout-unit">h</span></div>
        </div>
        <div class="readout-divider"></div>
        <div class="readout">
          <div class="readout-label">Earned / mo</div>
          <div class="readout-value" id="ro-earned">0<span class="readout-unit">kr</span></div>
        </div>
      </div>

      <button class="summary-card" id="go-gym">
        <div class="summary-top">
          <span class="summary-label">This week</span>
          <span class="summary-arrow">Gym →</span>
        </div>
        <div class="summary-bar-track">
          <div class="summary-bar-fill" id="gym-progress-fill"></div>
        </div>
        <div class="summary-detail" id="gym-progress-text">0 of 4 sessions logged</div>
      </button>

      <button class="summary-card" id="go-work">
        <div class="summary-top">
          <span class="summary-label">This month</span>
          <span class="summary-arrow">Work →</span>
        </div>
        <div class="summary-detail-large" id="work-summary-text">0.0h logged · 0 kr</div>
      </button>

    </section>

    <!-- Gym page -->
    <section id="page-gym" class="page hidden">
      <div class="card">
        <h2>Log a session</h2>

        <div class="field">
          <label for="session-type">Which session did you do?</label>
          <select id="session-type">
            <option value="">Select session...</option>
            <option value="Upper A">Upper A</option>
            <option value="Lower A">Lower A</option>
            <option value="Upper B">Upper B</option>
            <option value="Lower B">Lower B</option>
          </select>
        </div>

        <div class="field">
          <label for="session-date">Date</label>
          <input type="date" id="session-date" />
        </div>

        <button class="btn-primary" id="log-session-btn">Log session</button>
      </div>

      <div class="card">
        <div class="history-header">
          <h2>History</h2>
          <div class="view-toggle">
            <button id="view-list-btn" class="toggle-btn active">List</button>
            <button id="view-calendar-btn" class="toggle-btn">Calendar</button>
          </div>
        </div>

        <div id="history-list" class="history-list"></div>

        <div id="history-calendar" class="history-calendar hidden">
          <div class="cal-nav">
            <button id="cal-prev">&lt;</button>
            <span id="cal-month-label"></span>
            <button id="cal-next">&gt;</button>
          </div>
          <div id="cal-grid" class="cal-grid"></div>
        </div>
      </div>
    </section>

    <!-- Work page -->
    <section id="page-work" class="page hidden">

      <div class="card total-card">
        <div class="total-header">
          <h2>Total earned</h2>
          <select id="work-period">
            <option value="month">This month</option>
            <option value="total">Total</option>
          </select>
        </div>
        <div id="total-earned" class="total-amount">0<span class="total-unit">kr</span></div>
      </div>

      <div class="stat-row">
        <div class="card stat-card">
          <h3>Hours worked</h3>
          <div id="stat-hours" class="stat-value">0</div>
        </div>
        <div class="card stat-card">
          <h3>Earned</h3>
          <div id="stat-earned" class="stat-value">0<span class="stat-unit">kr</span></div>
        </div>
      </div>

      <div class="card">
        <h2>Log a shift</h2>

        <div class="field">
          <label for="shift-date">Date</label>
          <input type="date" id="shift-date" />
        </div>

        <div class="field">
          <label for="shift-hours">Hours worked</label>
          <input type="number" id="shift-hours" min="0" step="0.25" placeholder="e.g. 6.5" />
        </div>

        <button class="btn-primary" id="log-shift-btn">Log shift</button>
      </div>

      <div class="card">
        <h2>Shift history</h2>
        <div id="shift-list" class="history-list"></div>
      </div>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
